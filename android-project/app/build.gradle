apply plugin: 'com.android.application'

android {
    namespace 'com.xiaomi.acquicktimer'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaomi.acquicktimer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

// Mỗi lần build debug xong, chép APK ra gốc repo thành ACQuickTimer.apk (ghi đè bản cũ)
def rootApk = new File(rootProject.projectDir.parentFile, 'ACQuickTimer.apk')
tasks.register('copyApkToRoot') {
    def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    inputs.file(apk)
    outputs.file(rootApk)
    doLast {
        java.nio.file.Files.copy(apk.get().asFile.toPath(), rootApk.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
afterEvaluate {
    tasks.named('assembleDebug').configure { finalizedBy 'copyApkToRoot' }
}
